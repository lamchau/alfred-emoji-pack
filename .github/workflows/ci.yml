name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run checks
        run: just check

      - name: Rebuild packages
        run: |
          just build
          unzip -t "dist/Emoji Aliases.alfredsnippets"
          unzip -t "dist/Emoji Pack.alfredsnippets"
          unzip -t "dist/Emoji Pack.alfredworkflow"

      - name: Verify builds are reproducible
        run: |
          set -euo pipefail
          sha256sum dist/* > "${RUNNER_TEMP}/first-build.sha256"
          just build
          sha256sum --check --strict "${RUNNER_TEMP}/first-build.sha256"

      - name: Verify vendored data is current
        run: git diff --exit-code

  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07
